[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]
working_directory = "None"
live_config_reload = true

[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
dimensions = { columns = 100, lines = 30 }
dynamic_padding = true
decorations = "Full"
opacity = 0.8
title = "Alacritty@CachyOS"
class = { instance = "Alacritty", general = "Alacritty" }
decorations_theme_variant = "Dark"

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "monospace", style = "Regular" }
bold = { family = "monospace", style = "Bold" }
italic = { family = "monospace", style = "Italic" }
bold_italic = { family = "monospace", style = "Bold Italic" }
size = 12.0

[colors]
draw_bold_text_with_bright_colors = true

# Black & white (grayscale) palette - overrides the imported noctalia theme
[colors.primary]
background = "0x000000"
foreground = "0xFFFFFF"

[colors.cursor]
text = "0x000000"
cursor = "0xFFFFFF"

[colors.vi_mode_cursor]
text = "0x000000"
cursor = "0xFFFFFF"

[colors.selection]
text = "0x000000"
background = "0xFFFFFF"

[colors.normal]
black = "0x262626"
red = "0xC7C7C7"
green = "0xD6D6D6"
yellow = "0xBCBCBC"
blue = "0xA8A8A8"
magenta = "0xB0B0B0"
cyan = "0x9B9B9B"
white = "0xFFFFFF"

[colors.bright]
black = "0x5C5C5C"
red = "0xE8E8E8"
green = "0xF5F5F5"
yellow = "0xE0E0E0"
blue = "0xCFCFCF"
magenta = "0xDADADA"
cyan = "0xC0C0C0"
white = "0xFFFFFF"

[colors.dim]
black = "0x1F1F1F"
red = "0x8A8A8A"
green = "0x949494"
yellow = "0x828282"
blue = "0x777777"
magenta = "0x7D7D7D"
cyan = "0x6B6B6B"
white = "0xB0B0B0"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = { shape = "Underline", blinking = "Off" }
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true
# Вставка средним кликом встроена в alacritty - собственная привязка удваивала её.

[keyboard]
# В alacritty пользовательские bindings НЕ заменяют встроенные, а добавляются к ним,
# и на одно нажатие выполняются ВСЕ совпавшие привязки - см. alacritty(5):
# "Multiple keybindings can be triggered by a single key press".
# Раньше этот список повторял дефолты один в один, поэтому Ctrl+Shift+V (а также
# средний клик, Shift+Insert, Ctrl+L, Shift+PageUp) срабатывали дважды.
# Здесь оставлено только то, чего в дефолтах нет: в русской раскладке клавиши дают
# кириллические keysym, и встроенные V/C/F/B в ней не работают.
bindings = [
{ key = "М", mods = "Control|Shift", action = "Paste" },
{ key = "С", mods = "Control|Shift", action = "Copy" },
{ key = "А", mods = "Control|Shift", action = "SearchForward" },
{ key = "И", mods = "Control|Shift", action = "SearchBackward" },
]
